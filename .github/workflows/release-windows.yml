name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mobile-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion-apps/mobile-sync/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.2.2
        with:
          distribution: temurin
          java-version: 21

      - name: Install mobile dependencies
        working-directory: companion-apps/mobile-sync
        run: npm ci

      - name: Build Android APK
        working-directory: companion-apps/mobile-sync
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Configure the Android signing secrets before publishing a release." && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/caballocci-mobile.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/caballocci-mobile.keystore"
          npm run build
          npx cap sync android
          cd android
          bash gradlew --no-daemon assembleRelease

      - name: Preserve Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caballocci-android-apk
          path: companion-apps/mobile-sync/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release-windows:
    needs: build-mobile-apk
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Validate tag and package version
        shell: pwsh
        run: node scripts/verify-release.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build NSIS release
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify update artifacts
        run: node scripts/verify-release.mjs --artifacts

      - name: Download Android APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: caballocci-android-apk
          path: android-apk

      - name: Publish GitHub Release and update assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          Copy-Item android-apk/app-release.apk caballocci-android.apk
          $mobile = Get-Content companion-apps/mobile-sync/package.json -Raw | ConvertFrom-Json
          $metadata = @{
            version = $mobile.version
            minimumSupportedVersion = $mobile.minimumSupportedVersion
            apkUrl = "https://github.com/gattocci/caballocci/releases/download/${{ github.ref_name }}/caballocci-android.apk"
            releaseUrl = "https://github.com/gattocci/caballocci/releases/latest"
          } | ConvertTo-Json
          Set-Content -Path caballocci-android.json -Value $metadata -Encoding utf8NoBOM
          gh release create "${{ github.ref_name }}" `
            "release/caballocci-Setup-$version-x64.exe" `
            "release/caballocci-Setup-$version-x64.exe.blockmap" `
            "release/latest.yml" `
            "caballocci-android.apk" `
            "caballocci-android.json" `
            --title "caballocci $version" --generate-notes

      - name: Preserve artifacts in workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caballocci-windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            caballocci-android.apk
            caballocci-android.json
          if-no-files-found: error
